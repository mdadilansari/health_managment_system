apiVersion: apps/v1
kind: Deployment
metadata:
  name: prescription-service
  namespace: hms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prescription-service
  template:
    metadata:
      labels:
        app: prescription-service
    spec:
      containers:
        - name: prescription-service
          image: hms/prescription-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3006
          env:
            - name: PORT
              value: "3006"
            - name: DB_HOST
              value: "db-prescriptions"
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: hms-config
                  key: DB_PORT
            - name: DB_NAME
              value: "hms_prescriptions"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD

          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 300m
---
apiVersion: v1
kind: Service
metadata:
  name: prescription-service
  namespace: hms
spec:
  selector:
    app: prescription-service
  ports:
    - port: 3006
      targetPort: 3006
