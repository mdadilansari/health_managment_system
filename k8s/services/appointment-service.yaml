apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
  namespace: hms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appointment-service
  template:
    metadata:
      labels:
        app: appointment-service
    spec:
      containers:
        - name: appointment-service
          image: hms/appointment-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: DB_HOST
              value: "db-appointments"
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: hms-config
                  key: DB_PORT
            - name: DB_NAME
              value: "hms_appointment"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: hms-config
                  key: NOTIFICATION_SERVICE_URL
            - name: BILLING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: hms-config
                  key: BILLING_SERVICE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 300m
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-service
  namespace: hms
spec:
  selector:
    app: appointment-service
  ports:
    - port: 3003
      targetPort: 3003
