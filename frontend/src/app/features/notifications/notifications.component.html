<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">
      🔔 Notifications
    </h1>
    <button 
      class="btn btn-sm btn-outline-primary" 
      (click)="markAllAsRead()"
      [disabled]="notificationService.getUnreadCount() === 0">
      Mark All as Read
    </button>
  </div>

  <div *ngIf="notifications().length === 0" class="alert alert-info">
    No notifications to display.
  </div>

  <div class="notifications-list">
    <div 
      *ngFor="let notification of notifications()" 
      class="notification-item"
      [class.unread]="!notification.read"
      (click)="markAsRead(notification.id)">
      <div class="notification-icon">
        {{ getIcon(notification.type) }}
      </div>
      <div class="notification-content">
        <p class="notification-message mb-1">{{ notification.message }}</p>
        <small class="notification-time text-muted">{{ getTimeAgo(notification.created_at) }}</small>
      </div>
      <div class="notification-badge" *ngIf="!notification.read">
        <span class="badge bg-primary">New</span>
      </div>
    </div>
  </div>
</div>
