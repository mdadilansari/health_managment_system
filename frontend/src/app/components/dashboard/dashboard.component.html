<div class="dashboard-container">
  <div class="container-fluid px-5">
    <div class="text-center mb-4">
      <h1 class="display-4 fw-bold text-dark mb-3">
        🏥 Hospital Management System
      </h1>
      <p class="lead text-dark">Manage patients, doctors, appointments, and billing</p>
    </div>


    <div class="d-flex flex-wrap justify-content-center gap-4">
      <div class="dashboard-card-wrapper" *ngFor="let card of cards">
        <a [routerLink]="card.disabled ? null : card.route" 
           [class.disabled-card]="card.disabled"
           class="text-decoration-none">
          <div class="card h-100 dashboard-card" [ngClass]="'border-' + card.color">
            <div class="card-body text-center">
              <div class="card-icon mb-3" [ngClass]="'text-' + card.color">
                {{ card.icon }}
              </div>
              <h5 class="card-title fw-bold">{{ card.title }}</h5>
              <p class="card-text text-muted">{{ card.description }}</p>
              <div class="mt-3">
                <span class="badge" [ngClass]="'bg-' + card.color">
                  {{ card.count }}
                </span>
              </div>
            </div>
            <div class="card-footer" [ngClass]="'bg-' + card.color + ' bg-opacity-10'">
              <small class="text-muted" *ngIf="!card.disabled">Click to view →</small>
              <small class="text-muted" *ngIf="card.disabled">Coming soon...</small>
            </div>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
