global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'patient-service'
    static_configs:
      - targets: ['patient-service:3001']
    metrics_path: '/metrics'

  - job_name: 'doctor-service'
    static_configs:
      - targets: ['doctor-service:3002']
    metrics_path: '/metrics'

  - job_name: 'appointment-service'
    static_configs:
      - targets: ['appointment-service:3003']
    metrics_path: '/metrics'

  - job_name: 'billing-service'
    static_configs:
      - targets: ['billing-service:3004']
    metrics_path: '/metrics'

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:3005']
    metrics_path: '/metrics'

  - job_name: 'prescription-service'
    static_configs:
      - targets: ['prescription-service:3006']
    metrics_path: '/metrics'

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3007']
    metrics_path: '/metrics'
